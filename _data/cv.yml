      - company: Nonparametric Inference Lab, Department of Statistics, Seoul National University
        position: Undergraduate Researcher
        location: Seoul, Korea
        start_date: 2024-08
        end_date: 2026-07
        summary: "Advisor: Byeong U. Park"
        highlights:
          - "Derived uniform convergence rates for multivariate locally linear estimators under strong mixing, with an error expansion that separates stochastic variation, smoothing bias, and a term induced by local stationarity."
          - "Proposed bias-corrected transfer learning estimators that connect a sparsely observed target series to densely observed auxiliary domains through a smoothly varying bias function over rescaled time and covariates."
          - "Characterized a compatibility threshold, set by cross-domain curvature, separating the regime where transfer improves risk from the regime where heterogeneity leaves irreducible bias."
          - "Validated the theory through simulation studies and an empirical analysis of international fuel prices."
          - "Separately, built a multi-agent AutoGen pipeline for automated feature construction and variable selection in an industry collaboration (through Jan 2026)."

      - company: Time Series and Predictive Analytics Lab, Seoul National University
        position: Undergraduate Research Intern
        location: Seoul, Korea
        start_date: 2024-03
        end_date: 2024-07
        summary: "Advisor: Sangyeol Lee"
        highlights:
          - "Forecast population and housing prices in Gyeonggi Province with VAR and ARIMA models."
          - "Evaluated the models under rolling-origin forecasting."

    Publications:
      - title: Transfer Learning and Locally Linear Regression for Locally Stationary Time Series
        authors:
          - Jinwoo Park
        publisher: arXiv preprint arXiv:2511.12948
        releaseDate: 2025-11-17
        url: https://arxiv.org/abs/2511.12948
        summary: >
          Uniform convergence for multivariate locally linear estimators under strong mixing,
          and bias-corrected transfer learning estimators that let a sparsely observed series
          borrow strength from densely observed related sources.

